server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 过期时间
    session:
      cookie:
        max-age: 2592000
spring:
  application:
    name: cloud-picture-backend
    # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cloud_picture
    username: root
    password: 123456
  redis:
    database: 0
    host: localhost
    port: 6379
    connect-timeout: 5000
#    username: root
    password: 123456
  # session 配置
  session:
    store-type: redis
    # session 过期时间
    timeout: 2592000  # 30 天
  # 文件上传最大体积
  servlet:
    multipart:
      max-file-size: 10MB
  shardingsphere:
    datasource:
      names: cloud_picture
      cloud_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/cloud_picture
        username: root
        password: 123456
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: cloud_picture.picture # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.gre.cloudpicturebackend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
    enable-sql-runner: true
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.gre.cloudpicturebackend.controller
# 对象存储配置
cos:
  client:
    host: XXX
    secretId: XXX
    secretKey: XXX
    region: XXX
    bucket: XXX
# 阿里云 AI 配置
aliYunAi:
  apiKey: XXX
